[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exspectra"
version = "0.1.0"
description = "Importable ExSpectra components for co-adaptive replay valuation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[tool.setuptools]
py-modules = [
    "allocation",
    "audit",
    "calibration",
    "caud",
    "displacement",
    "influence",
]
